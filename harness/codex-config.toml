approval_policy = "never"
sandbox_mode = "danger-full-access"
model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"
cli_auth_credentials_store = "file"

[tui]
status_line = ["model-with-reasoning", "context-remaining", "current-dir", "git-branch", "five-hour-limit", "weekly-limit", "estimated-thread-cost"]
auto_recap = false
status_line_use_colors = true

[tui.effects]
welcome = false

[projects."/workspace"]
trust_level = "trusted"
